name: CI

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build CI image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ci
          load: true
          tags: scenescan-ci:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify patched Next.js version
        run: |
          installed_version="$(docker run --rm scenescan-ci:${{ github.sha }} node -p "require('next/package.json').version")"
          test "$installed_version" = "16.3.8"

      - name: Audit production dependencies
        run: docker run --rm scenescan-ci:${{ github.sha }} pnpm audit --prod --audit-level high

      - name: Lint
        run: docker run --rm scenescan-ci:${{ github.sha }} pnpm lint

      - name: Type check
        run: docker run --rm scenescan-ci:${{ github.sha }} pnpm typecheck

      - name: Unit tests (Auth, fake providers, and region contracts included)
        run: docker run --rm scenescan-ci:${{ github.sha }} pnpm test

      - name: Validate production metadata and migration contracts offline
        run: |
          docker run --rm scenescan-ci:${{ github.sha }} \
            pnpm data:validate data/production/locations.json /tmp/scenescan-validation-report.json \
              --metadata-only \
              --embedding-manifest data/production/embeddings-manifest.json \
              --image-licenses data/production/image-licenses.json
          docker run --rm scenescan-ci:${{ github.sha }} \
            pnpm embeddings:import data/production/embeddings.json --validate-only
          docker run --rm scenescan-ci:${{ github.sha }} pnpm embeddings:audit-schema

      - name: Verify server secrets stay out of the client bundle
        run: |
          docker run --rm \
            --env SUPABASE_URL=https://boundary-test.supabase.co \
            --env SUPABASE_SECRET_KEY=scenescan-ci-server-only-boundary-sentinel \
            --env SUPABASE_SERVICE_ROLE_KEY=scenescan-ci-legacy-role-boundary-sentinel \
            --env KMA_VILLAGE_FORECAST_SERVICE_KEY=scenescan-ci-kma-boundary-sentinel \
            --env PUBLIC_DATA_PORTAL_SERVICE_KEY=scenescan-ci-data-provider-boundary-sentinel \
            --env NVIDIA_API_KEY=scenescan-ci-nvidia-boundary-sentinel \
            scenescan-ci:${{ github.sha }} \
            sh -c 'pnpm build && pnpm security:client-bundle'

      - name: Create ignored fake server-secret canaries
        run: |
          umask 077
          printf '%s\n' \
            'SUPABASE_SECRET_KEY=scenescan-ci-supabase-secret-canary' \
            'SUPABASE_SERVICE_ROLE_KEY=scenescan-ci-legacy-role-canary' \
            'KMA_VILLAGE_FORECAST_SERVICE_KEY=scenescan-ci-kma-provider-canary' \
            'PUBLIC_DATA_PORTAL_SERVICE_KEY=scenescan-ci-data-provider-canary' \
            'NVIDIA_API_KEY=scenescan-ci-nvidia-provider-canary' \
            > .env.production.local

      - name: Build standalone application
        uses: docker/build-push-action@v7
        with:
          context: .
          target: builder
          load: true
          tags: scenescan-builder:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_USE_MOCK_DATA=true
            NEXT_PUBLIC_USE_MOCK_AI=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build production Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          load: true
          tags: scenescan:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_USE_MOCK_DATA=true
            NEXT_PUBLIC_USE_MOCK_AI=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build browser E2E image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: e2e
          load: true
          tags: scenescan-e2e:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify production container boundary
        run: |
          test "$(docker inspect --format '{{.Config.User}}' scenescan:${{ github.sha }})" = "nextjs"
          test "$(docker run --rm --entrypoint id scenescan:${{ github.sha }} -u)" = "1001"
          test "$(docker inspect --format '{{if .Config.Healthcheck}}configured{{end}}' scenescan:${{ github.sha }})" = "configured"

      - name: Verify fake server secrets stay out of the production image
        env:
          SCENESCAN_SECRET_CANARIES: '["scenescan-ci-supabase-secret-canary","scenescan-ci-legacy-role-canary","scenescan-ci-kma-provider-canary","scenescan-ci-data-provider-canary","scenescan-ci-nvidia-provider-canary"]'
        run: node scripts/security/assert-docker-image-secrets.mjs scenescan:${{ github.sha }}

      - name: Smoke test production image
        run: |
          docker network create scenescan-ci-network
          docker run --detach --name scenescan-ci-app --network scenescan-ci-network --publish 3000:3000 scenescan:${{ github.sha }}
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            docker logs scenescan-ci-app
            exit 1
          fi
          healthy=0
          for attempt in $(seq 1 45); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' scenescan-ci-app)" = "healthy" ]; then
              healthy=1
              break
            fi
            sleep 1
          done
          if [ "$healthy" -ne 1 ]; then
            docker inspect --format '{{json .State.Health}}' scenescan-ci-app
            exit 1
          fi
          curl --fail --silent --output /dev/null http://127.0.0.1:3000/
          curl --fail --silent --output /dev/null http://127.0.0.1:3000/search
          # Fixture id, not a literal "demo-01" string -- see
          # src/domains/locations/fixtures/locations.ts (fixed UUIDs so mock
          # data also exercises uuid-shaped code paths; "demo-01" survives
          # only as that fixture's `slug`, for its SVG filename).
          curl --fail --silent --output /dev/null http://127.0.0.1:3000/locations/00000000-0000-4000-8000-000000000001
          response_headers="$(curl --fail --silent --dump-header - --output /dev/null http://127.0.0.1:3000/search)"
          printf '%s\n' "$response_headers" | grep --ignore-case --quiet '^content-security-policy:.*default-src'
          printf '%s\n' "$response_headers" | grep --ignore-case --quiet '^strict-transport-security: max-age=63072000; includeSubDomains'
          printf '%s\n' "$response_headers" | grep --ignore-case --quiet '^x-content-type-options: nosniff'
          printf '%s\n' "$response_headers" | grep --ignore-case --quiet '^x-frame-options: DENY'
          printf '%s\n' "$response_headers" | grep --ignore-case --quiet '^referrer-policy: strict-origin-when-cross-origin'
          printf '%s\n' "$response_headers" | grep --ignore-case --quiet '^permissions-policy:'
          if printf '%s\n' "$response_headers" | grep --ignore-case --quiet '^x-powered-by:'; then
            echo "X-Powered-By must not be exposed"
            exit 1
          fi

      - name: Browser E2E in key-free Docker mock mode
        run: |
          # Chromium exempts loopback from upgrade-insecure-requests. A plain
          # HTTP Docker DNS hostname upgrades JS/CSS to nonexistent HTTPS and
          # prevents hydration. Use the runner's published loopback port;
          # keep the production CSP intact instead of disabling security.
          docker run --rm \
            --network host \
            --ipc=host \
            --env CI=true \
            --env PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000 \
            --volume "${{ github.workspace }}/output/playwright:/app/output/playwright" \
            scenescan-e2e:${{ github.sha }} \
            pnpm test:e2e

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: output/playwright
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean up smoke container
        if: always()
        run: |
          docker rm --force scenescan-ci-app || true
          docker network rm scenescan-ci-network || true
          rm -f .env.production.local

  local-auth-and-rls:
    name: Local Auth, Mailpit, and RLS
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Start disposable local Supabase and Mailpit
        run: pnpm supabase:start

      - name: Run migrated schema and RLS integration tests
        run: |
          set -a
          . ./.env.integration.example
          set +a
          pnpm test:integration

      - name: Run local Auth and account browser flow
        run: pnpm test:e2e:auth

      - name: Upload local Auth diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: local-auth-playwright-${{ github.run_attempt }}
          path: output/playwright/auth-local
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop disposable local Supabase
        if: always()
        run: pnpm supabase:stop --no-backup || true
