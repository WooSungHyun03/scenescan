name: Production smoke

on:
  workflow_dispatch:
  schedule:
    # Tuesday 06:17 KST. One real CLIP query per weekly run keeps free-tier use low.
    - cron: "17 21 * * 1"

concurrency:
  group: production-smoke
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the single-query production smoke
        env:
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL || 'https://beceleb.org' }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: pnpm test:e2e:production

      - name: Upload failure screenshot and diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/playwright/production-smoke
          if-no-files-found: error
          retention-days: 7
